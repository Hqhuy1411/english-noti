AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Coach service -- the reply channel.

  Receives Telegram updates on an HTTP API webhook: button presses, written
  answers, and voice notes. Deployed once, not once per environment: there is one
  bot and Telegram allows it one webhook URL, so an EnvironmentName suffix here
  would buy nothing and cost a second URL nobody can point at.

  Authentication is the secret_token header Telegram echoes back, checked against
  a SecureString, plus a single-chat allowlist. A rejected update still answers
  200 -- see the handler for why a 401 would be worse.

Parameters:
  TelegramChatId:
    Type: String
    Description: The only chat allowed to reach this webhook. Not a secret.

  StudyTableName:
    Type: String
    Description: Study table, used here for update_id de-duplication records.

  LogRetentionDays:
    Type: Number
    Default: 30
    Description: CloudWatch Logs retention, in days.

  TokenParameterName:
    Type: String
    Default: /english-reminder/telegram-bot-token
    Description: SSM SecureString holding the bot token, created out-of-band.

  WebhookSecretParameterName:
    Type: String
    Default: /english-reminder/telegram-webhook-secret
    Description: >
      SSM SecureString holding the secret_token Telegram sends back on every
      webhook request. Created out-of-band for the same reason as the bot token:
      CloudFormation cannot express a SecureString (ADR 0004).

Resources:
  # Voice notes land here on the way to Transcribe, and the transcripts come back
  # to the same bucket. Nothing here is worth keeping: the transcript is copied
  # into the study table, and the audio has served its purpose once it is read.
  AudioBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketName: !Sub english-reminder-audio-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-recordings
            Status: Enabled
            ExpirationInDays: 30

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/english-reminder-coach
      RetentionInDays: !Ref LogRetentionDays

  ReplyApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: live
      # No auth here on purpose: the secret_token header is checked inside the
      # function, because a rejected request must still answer 200.
      DefinitionBody:
        openapi: 3.0.1
        info:
          title: english-reminder coach webhook
          version: '1.0'
        paths:
          /telegram:
            post:
              responses:
                default:
                  description: Always 200 -- Telegram retries anything else.
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                payloadFormatVersion: '2.0'
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${IngestFunction.Arn}/invocations

  IngestFunction:
    Type: AWS::Serverless::Function
    DependsOn: LogGroup
    Properties:
      FunctionName: english-reminder-coach
      Description: Receives Telegram updates -- buttons, text and voice notes.
      CodeUri: src/
      Handler: handler.handler
      Runtime: nodejs22.x
      Architectures:
        - arm64
      # Telegram's delivery window is short. This function authenticates,
      # de-duplicates and acknowledges; nothing here should approach 10s.
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          TELEGRAM_CHAT_ID: !Ref TelegramChatId
          SSM_TOKEN_PARAM: !Ref TokenParameterName
          SSM_WEBHOOK_SECRET_PARAM: !Ref WebhookSecretParameterName
          STUDY_TABLE: !Ref StudyTableName
          AUDIO_BUCKET: !Ref AudioBucket
      Policies:
        - SSMParameterWithSlashPrefixReadPolicy:
            ParameterName: /english-reminder/*
        - DynamoDBCrudPolicy:
            TableName: !Ref StudyTableName
        - S3CrudPolicy:
            BucketName: !Sub english-reminder-audio-${AWS::AccountId}
        - Statement:
            - Effect: Allow
              Action:
                - transcribe:StartTranscriptionJob
              # Transcribe job names are not ARNs that can be scoped ahead of
              # time; the bucket policy above is the real boundary.
              Resource: '*'
      Events:
        Webhook:
          Type: HttpApi
          Properties:
            ApiId: !Ref ReplyApi
            Path: /telegram
            Method: POST

  GradeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/english-reminder-coach-grade
      RetentionInDays: !Ref LogRetentionDays

  # Woken by Transcribe finishing, not by polling. The job name carries the
  # chat, the date and the update id, because that event is the only context
  # this function gets.
  GradeFunction:
    Type: AWS::Serverless::Function
    DependsOn: GradeLogGroup
    Properties:
      FunctionName: english-reminder-coach-grade
      Description: Turns a finished transcript into feedback and an SRS update.
      CodeUri: src/
      Handler: grade.handler
      Runtime: nodejs22.x
      Architectures:
        - arm64
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          TELEGRAM_CHAT_ID: !Ref TelegramChatId
          SSM_TOKEN_PARAM: !Ref TokenParameterName
          STUDY_TABLE: !Ref StudyTableName
          AUDIO_BUCKET: !Ref AudioBucket
      Policies:
        - SSMParameterWithSlashPrefixReadPolicy:
            ParameterName: /english-reminder/*
        - DynamoDBCrudPolicy:
            TableName: !Ref StudyTableName
        - S3CrudPolicy:
            BucketName: !Sub english-reminder-audio-${AWS::AccountId}
        - Statement:
            - Effect: Allow
              Action:
                - transcribe:GetTranscriptionJob
              Resource: '*'
      Events:
        TranscribeFinished:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source:
                - aws.transcribe
              detail-type:
                - Transcribe Job State Change
              detail:
                # FAILED is included deliberately: silence on failure is
                # indistinguishable from a job still running.
                TranscriptionJobStatus:
                  - COMPLETED
                  - FAILED

Outputs:
  AudioBucketName:
    Description: Where voice notes and transcripts live for thirty days.
    Value: !Ref AudioBucket

  WebhookUrl:
    Description: >
      Point Telegram at this with services/coach/scripts/set-webhook.mjs.
      Knowing the URL is not enough to use it -- the secret_token header is.
    Value: !Sub https://${ReplyApi}.execute-api.${AWS::Region}.amazonaws.com/live/telegram

  FunctionName:
    Description: Coach function name.
    Value: !Ref IngestFunction

  LogGroupName:
    Description: CloudWatch log group for inbound updates.
    Value: !Ref LogGroup
